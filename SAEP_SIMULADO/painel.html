
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMaq | Painel</title>
    <link rel="stylesheet" href="assets/estilo.css">
</head>
<body>

<header class="header">
    <h2> TECHMAQ</h2>
    <button onclick="sair()">Sair</button>
</header>

<main class="dashboard">

    <h1>Painel de Manutenção</h1>
    <p>Bem-vindo ao sistema de chamados.</p>

    <div class="cards">

        <div class="card">
            <h3>Total de chamados</h3>
            <h2 id="total">0</h2>
        </div>

        <div class="card">
            <h3>Chamados abertos</h3>
            <h2 id="abertos">0</h2>
        </div>

        <div class="card">
            <h3>Concluídos</h3>
            <h2 id="concluidos">0</h2>
        </div>

    </div>

    <a href="abrir-chamado.html" class="novo-chamado">
        + Abrir novo chamado
    </a>

    <section class="tabela">

        <h2>Chamados registrados</h2>

        <table>
            <thead>
                <tr>
                    <th>Número</th>
                    <th>Equipamento</th>
                    <th>Descrição</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="listaChamados"></tbody>
        </table>

    </section>

</main>

<script src="assets/app.js"></script>
</body>
</html>
